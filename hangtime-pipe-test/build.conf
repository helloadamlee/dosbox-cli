[sdl]
fullscreen = false
autolock = false

[dosbox]
memsize = 8

[dos]
# Registered under [dos] (see dosbox-x.reference.conf), NOT [dosbox] --
# it was silently ignored here before, so the MCB auto-repair never ran.
mcb corruption becomes application free memory = true

[cpu]
core = normal
cputype = auto
cycles = max

[autoexec]
mount c "C:\Projects\hangtime\Asure\nba-hangtime-rebuild-main\BACKUP\XCODE101L"
c:
path Z:\;C:\;C:\tools
set TEMP=C:\
set TMP=C:\
