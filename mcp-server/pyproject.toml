[project]
name = "dosbox-x-mcp"
version = "0.2.0"
description = "MCP server wrapping DOSBox-X host-control for agentic DOS automation"
# 3.10, not 3.9: mcp 2.0 declares Requires-Python >=3.10, so a 3.9 install
# fails to resolve mcp at all. The floor is set by the dependency, not by our
# own syntax use.
requires-python = ">=3.10"
# Floor of 2, not >=1.2.0: server.py builds on mcp.server.mcpserver, which
# exists only from 2.0 onwards. The 1.x line has mcp.server.fastmcp instead,
# so an install that resolved 1.x would die on import.
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
dosbox-mcp = "dosbox_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dosbox_mcp*"]
