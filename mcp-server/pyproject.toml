[project]
name = "dosbox-x-mcp"
version = "0.1.0"
description = "MCP server wrapping DOSBox-X host-control for agentic DOS automation"
requires-python = ">=3.9"
# mcp 2.0 removed mcp.server.fastmcp (the FastMCP entry point server.py is
# built on) in favour of mcp.server.mcpserver. Until server.py is ported,
# an uncapped ">=1.2.0" resolves to 2.x and the dosbox-mcp console script
# dies on import. Lift the cap only together with that port.
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
dosbox-mcp = "dosbox_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dosbox_mcp*"]
